        body {
            font-family: Arial, sans-serif;
            background-image: url('herbal-garden.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            background-color: #f5e8de;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5em;
            margin: 0;
            flex-grow: 1;
            text-align: center;
            padding: 0 15px;
            color: #000;
            font-weight: bold;
        }

        .search-container {
            margin-right: 0;
            flex-grow: 0;
            position: relative; /* مهم لإظهار قائمة الاقتراحات */
        }

        .search-container input {
            width: 90%;
            max-width: 300px;
            padding: 8px;
            border: none;
            border-radius: 20px;
            text-align: right;
        }

        .autocomplete-list {
            position: absolute;
            z-index: 99;
            top: 100%;
            right: 0;
            width: 100%;
            background-color: #fff;
            border: 1px solid #ddd;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .autocomplete-list-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        
        .autocomplete-list-item:hover {
            background-color: #f0f0f0;
        }

        nav {
            margin-top: 0;
            padding-right: 0;
        }

        .nav-links {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            color: #000;
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #4CAF50;
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 10;
            list-style: none;
            padding: 0;
            max-height: 300px; 
            overflow-y: scroll;
        }

        .dropdown-menu li a {
            color: #000;
            font-weight: normal;
            font-size: 1em;
            padding: 12px 16px;
            display: block;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        #herbs-menu li a:hover {
            background-color: #3e8e41;
            color: #fff;
        }

        #videos-menu li a:hover {
            background-color: #3e8e41;
            color: #fff;
        }

        #quran-menu li a:hover {
            background-color: #3e8e41;
            color: #fff;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 700px;
            border-radius: 10px;
            position: relative;
            text-align: center;
        }
        
        #options-modal-content {
            text-align: center;
            padding: 40px 20px;
        }
        
        .options-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .options-buttons button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        
        .options-buttons button:hover {
            background-color: #3e8e41;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-header h2 {
            margin: 0;
            color: #4CAF50;
            font-size: 1.8em;
            flex-grow: 1;
            text-align: center;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-body {
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: scroll;
            text-align: right;
        }

            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .modal-image {
            max-width: 80%;
            display: block;
            margin: 0 auto;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .modal-footer {
            display: flex;
            justify-content: space-around;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .modal-footer button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;

            background-color: #3e8e41;
        }

        .modal-footer .secondary-button {
            background-color: #f44336;
        }
        .modal-footer .secondary-button:hover {
            background-color: #da190b;
        }

            width: 90%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;

        }

            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        #herb-details-page,

            display: none !important;
        }

        /* -------------------------------------- */

                padding: 15px;
                align-items: center;

                margin-bottom: 15px;
            }

                width: 100%;
                order: 1;
                margin-bottom: 10px;

                width: 100%;

            }

                width: 100%;

            }
            
            .dropdown-menu li a {
                font-weight: normal;
            }
            
            .dropdown:hover .dropdown-menu {
                display: block;
            }

            .modal-content {
                width: 95%;
                max-width: none;
            }
        }
    </style>
</head>

        // وظائف JavaScript
        const modal = document.getElementById('myModal');
        const optionsModal = document.getElementById('optionsModal');
        const contactModal = document.getElementById('contactModal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body-content');
        const optionsModalTitle = document.getElementById('options-modal-title');
        const herbsMenu = document.getElementById('herbs-menu');
        const videosMenu = document.getElementById('videos-menu');
        const quranMenu = document.getElementById('quran-menu');
        const searchInput = document.getElementById('searchInput');
        const autocompleteList = document.getElementById('autocomplete-list');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const contactLink = document.getElementById('contact-link');
        const viewVideoBtn = document.getElementById('viewVideoBtn');
        const readInfoBtn = document.getElementById('readInfoBtn');

        let currentData = [];
        let currentIndex = 0;
        let currentType = '';
        let currentItem = null;

        function showModal(data, index, type, viewMode = 'both') {
            currentData = data;
            currentIndex = index;
            currentType = type;
            const item = currentData[currentIndex];
            currentItem = item; // تحديث العنصر الحالي
            
            modalTitle.textContent = item.name;
            modalBody.innerHTML = '';
            
            // إضافة المحتوى بناءً على النوع ووضع العرض
            if (currentType === 'herb') {
                if (viewMode === 'info' || viewMode === 'both') {
                    if (item.image) {
                        const img = document.createElement('img');
                        img.src = item.image;
                        img.alt = item.name;
                        img.classList.add('modal-image');
                        modalBody.appendChild(img);
                    }
                    if (item.benefits) {
                        const benefitsHeader = document.createElement('h3');
                        benefitsHeader.textContent = "الفوائد:";
                        modalBody.appendChild(benefitsHeader);
                        const benefitsList = document.createElement('ul');
                        item.benefits.forEach(benefit => {
                            const li = document.createElement('li');
                            li.textContent = benefit;
                            benefitsList.appendChild(li);
                        });
                        modalBody.appendChild(benefitsList);
                    }
                    if (item.howToUse) {
                        const howToUseHeader = document.createElement('h3');
                        howToUseHeader.textContent = "طريقة الاستخدام:";
                        modalBody.appendChild(howToUseHeader);
                        const p = document.createElement('p');
                        p.textContent = item.howToUse;
                        modalBody.appendChild(p);
                    }
                    if (item.cautions) {
                        const cautionsHeader = document.createElement('h3');
                        cautionsHeader.textContent = "محاذير:";
                        modalBody.appendChild(cautionsHeader);
                        const p = document.createElement('p');
                        p.textContent = item.cautions;
                        modalBody.appendChild(p);
                    }
                }
                if (viewMode === 'video') {
                    if (item.videoSrc) {
                        const video = document.createElement('video');
                        video.src = item.videoSrc;
                        video.controls = true;
                        video.autoplay = true;
                        video.loop = true;
                        modalBody.appendChild(video);
                    }
                }
            } else if (currentType === 'video') {
                if (item.videoSrc) {
                    const video = document.createElement('video');
                    video.src = item.videoSrc;
                    video.controls = true;
                    video.autoplay = true;
                    video.loop = true;
                    modalBody.appendChild(video);
                }
            } else if (currentType === 'quran') {
                if (item.image) {
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.classList.add('modal-image');
                    modalBody.appendChild(img);
                }
                const p = document.createElement('p');
                p.innerHTML = item.text;
                modalBody.appendChild(p);
            }
            
            // تحديث حالة أزرار التنقل
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === currentData.length - 1);

            modal.style.display = 'flex';
        }

        function hideModal() {
            const video = modalBody.querySelector('video');
            if (video) {
                video.pause();
                video.currentTime = 0;
            }
            modal.style.display = 'none';
        }
        
        function hideOptionsModal() {
            optionsModal.style.display = 'none';
        }

        function hideContactModal() {
            contactModal.style.display = 'none';
        }

        function showNext() {
            if (currentIndex < currentData.length - 1) {
                showModal(currentData, currentIndex + 1, currentType);
            }
        }

        function showPrev() {
            if (currentIndex > 0) {
                showModal(currentData, currentIndex - 1, currentType);
            }
        }
        
        prevBtn.addEventListener('click', showPrev);
        nextBtn.addEventListener('click', showNext);
        
        window.onclick = function(event) {
            if (event.target == modal) {
                hideModal();
            }
            if (event.target == optionsModal) {
                hideOptionsModal();
            }
            if (event.target == contactModal) {
                hideContactModal();
            }
        }

        function renderMenuItems(menu, items, type) {
            menu.innerHTML = '';
            if (items.length > 0) {
                items.forEach((item, index) => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#';
                    
                    if (type === 'herb') {
                        a.textContent = item.name;
                    } else if (type === 'video') {
                        a.textContent = `فيديو عن ${item.name}`;
                    } else if (type === 'quran') {
                        a.textContent = item.name;
                    }
                    
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        showModal(items, index, type);
                    });
                    
                    li.appendChild(a);
                    menu.appendChild(li);
                });
            } else {
                const li = document.createElement('li');
                li.textContent = 'لا توجد نتائج';
                li.style.color = 'white';
                li.style.padding = '12px 16px';
                menu.appendChild(li);
            }
        }
        
        function showOptionsModal(item) {
            currentItem = item;
            optionsModalTitle.textContent = item.name;
            optionsModal.style.display = 'flex';
        }

        // إنشاء القوائم المنسدلة عند تحميل الصفحة
        renderMenuItems(herbsMenu, herbs, 'herb');
        renderMenuItems(videosMenu, herbs.filter(h => h.videoSrc), 'video');
        renderMenuItems(quranMenu, quranData, 'quran');

        // البحث التلقائي
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            autocompleteList.innerHTML = '';
            if (query.length > 0) {
                const filteredItems = [...herbs, ...quranData].filter(item => item.name.toLowerCase().includes(query) || (item.text && item.text.includes(query)) || (item.benefits && item.benefits.some(b => b.includes(query))));
                
                if (filteredItems.length > 0) {
                    filteredItems.forEach(item => {
                        const div = document.createElement('div');
                        div.classList.add('autocomplete-list-item');
                        div.textContent = item.name;
                        div.addEventListener('click', () => {
                            searchInput.value = item.name;
                            autocompleteList.innerHTML = '';
                            if (item.type === 'herb' && item.videoSrc) {
                                showOptionsModal(item);
                            } else {
                                showModal([item], 0, item.type, 'info'); // تم الإصلاح هنا
                            }
                        });
                        autocompleteList.appendChild(div);
                    });
                }
            }
        });
        
        // معالجة البحث عند الضغط على مفتاح Enter
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.trim().toLowerCase();
                autocompleteList.innerHTML = '';
                const foundItem = [...herbs, ...quranData].find(item => item.name.toLowerCase().includes(query));
                
                if (foundItem) {
                    if (foundItem.type === 'herb' && foundItem.videoSrc) {
                        showOptionsModal(foundItem);
                    } else {
                        showModal([foundItem], 0, foundItem.type, 'info');
                    }
                } else {
                    alert("لم يتم العثور على نتائج مطابقة. حاول بكلمة أخرى.");
                }
            }
        });

        // إخفاء قائمة الاقتراحات عند النقر خارجها
        document.addEventListener('click', (e) => {
            if (!e.target.matches('#searchInput')) {
                autocompleteList.innerHTML = '';
            }
        });

        // أزرار نافذة الخيارات
        viewVideoBtn.addEventListener('click', () => {
            hideOptionsModal();
            if (currentItem) {
                showModal([currentItem], 0, currentItem.type, 'video');
            }
        });
        
        readInfoBtn.addEventListener('click', () => {
            hideOptionsModal();
            if (currentItem) {
                showModal([currentItem], 0, currentItem.type, 'info');
            }
        });

        // إظهار نافذة التواصل
        contactLink.addEventListener('click', (e) => {
            e.preventDefault();
            contactModal.style.display = 'flex';
        });

        // رسالة الإرسال في نموذج التواصل
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const message = document.getElementById('message-area').value;
            if (message.trim() !== '') {
                alert('شكرا لتواصلك! تم إرسال رسالتك.');
                document.getElementById('message-area').value = '';
                hideContactModal();
            } else {
                alert('الرجاء كتابة رسالتك أولاً.');
            }
        });
    </script>
