<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كُنْ مَعَ اللهِ تَرى اللهَ مَعَكْ</title>
<link rel="icon" type="image/x-icon" href="radio.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@600&display=swap"
rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "Tajawal", sans-serif;
}
.copyright {
text-align: center;
padding: 15px;
margin-top: 15px;
color: #333;
font-size: 14px;
border-top: 1px solid #eee;
}
.all-stations-section,
.stations-section,
.hero-section {
/* إزالة min-height: 100vh لضغط الصفحة */
/* ضغط الـ Padding العلوي والسفلي */
padding: 80px 20px 20px;
/* الخلفية البيج الدافئة */
background: linear-gradient(to bottom, #f5f5dc, #e0d8c7);
color: #333;
}
/* تعديل المسافة العلوية لقسم hero بعد حذف المحتوى */
.hero-section {
padding-top: 60px; /* تقليل المسافة بعد شريط التنقل */
padding-bottom: 0px; /* إلغاء المسافة السفلية تقريباً */
}
nav {
background-color: #004d40;
padding: 1rem;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
position: fixed;
width: 100%;
z-index: 1000;
}
.nav-container {
display: flex;
/* يحافظ على المسافة حول اللوجو */
justify-content: space-between;
align-items: center;
max-width: 1200px;
margin: 0 auto;
}
.logo {
color: white;
text-decoration: none;
font-size: 2rem;
font-weight: 700;
text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
/* التعديل الجديد: مركزة النص */
width: 100%;
text-align: center;
}
.nav-links {
/* التعديل الجديد: إخفاء عنصر الروابط الفارغ لمركزة اللوجو */
display: none;
}
.nav-links a {
color: white;
text-decoration: none;
font-size: 1.1rem;
font-weight: 500;
transition: color 0.3s ease;
}
.nav-links a:hover {
color: #4db6ac;
}
.menu-btn {
display: none;
color: white;
font-size: 1.5rem;
cursor: pointer;
}
.overlay {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.5);
z-index: 998;
}
.overlay.active {
display: block;
}
@media (max-width: 768px) {
.menu-btn {
display: block;
position: relative;
z-index: 1001;
}
.nav-links {
/* إظهار الروابط في قائمة الهاتف */
display: none;
position: fixed;
top: 0;
right: -100%;
width: 250px;
height: 100vh;
background-color: #004d40;
flex-direction: column;
padding-top: 80px;
text-align: center;
transition: 0.3s ease-in-out;
z-index: 999;
}
.logo {
position: relative;
z-index: 1001;
}
.nav-links.active {
display: flex;
right: 0;
}
.nav-links a {
padding: 0.8rem 0;
text-align: center;
}
audio {
position: relative;
z-index: 1;
}
}
.nav-links a {
color: white;
text-decoration: none;
font-size: 1.1rem;
font-weight: 500;
transition: color 0.3s ease;
}
.nav-links a:hover {
color: #4db6ac;
}

/* ضغط المسافات الداخلية في قسم هيرو */
.hero-content {
padding-bottom: 0px;
}
.hero-content h2 {
font-size: 2rem;
margin-bottom: 1rem;
color: #004d40;
font-family: "Amiri", serif;
}
.hero-content p {
font-size: 1.2rem;
line-height: 1.8;
margin-bottom: 1.5rem;
color: #004d40;
max-width: 90%;
}
.search-container {
max-width: 600px;
/* ضغط المسافة السفلية للبحث */
margin: 0 auto 1.5rem auto;
padding: 0 1rem;
position: relative;
}
.search-icon {
position: absolute;
left: 2rem;
top: 50%;
transform: translateY(-50%);
color: rgba(0, 77, 64, 0.7);
font-size: 1.2rem;
}
.search-container input {
width: 100%;
padding: 1rem 1rem 1rem 3.5rem;
font-size: 1.1rem;
border: none;
border-radius: 8px;
background: rgba(0, 77, 64, 0.1);
color: #004d40;
backdrop-filter: blur(5px);
transition: all 0.3s ease;
}
.search-container input::placeholder {
color: rgba(0, 77, 64, 0.7);
}
.search-container input:focus {
outline: none;
background: rgba(0, 77, 64, 0.15);
box-shadow: 0 0 0 2px rgba(0, 77, 64, 0.3);
}
.search-container input:focus + .search-icon {
color: #004d40;
}
.radio-player {
/* التعديل هنا: زيادة المسافة العلوية لدفعه للأسفل */
margin-top: 1.5rem;
width: 100%;
display: flex;
justify-content: center;
align-items: center;
}
/* Custom Audio Player Styles */
.custom-audio-player {
background: rgba(0, 77, 64, 0.1);
border-radius: 12px;
padding: 15px;
display: flex;
align-items: center;
gap: 15px;
max-width: 400px;
width: 100%;
border: 2px solid rgba(0, 77, 64, 0.2);
}
.play-pause-btn {
background: #004d40;
border: none;
border-radius: 50%;
width: 50px;
height: 50px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
color: white;
font-size: 18px;
}
.play-pause-btn:hover {
background: #00695c;
}
.mute-btn {
background: #004d40;
border: none;
border-radius: 50%;
width: 40px;
height: 40px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
color: white;
font-size: 16px;
}
.mute-btn:hover {
background: #00695c;
}
.mute-btn.muted {
background: #d32f2f;
}
.mute-btn.muted:hover {
background: #f44336;
}
.station-info {
flex: 1;
display: flex;
flex-direction: column;
gap: 5px;
}
.station-name {
color: #004d40;
font-weight: 600;
font-size: 16px;
text-align: right;
}
.status {
color: #004d40;
font-size: 14px;
text-align: right;
}
/* Hide default audio element */
#mainAudio {
display: none;
}
/* Mobile responsive */
@media (max-width: 768px) {
.custom-audio-player {
flex-direction: row;
justify-content: space-between;
align-items: center;
gap: 10px;
padding: 12px;
}
.station-info {
flex: 1;
margin: 0 10px;
text-align: center;
}
.station-name,
.status {
text-align: center;
}
}
@media (max-width: 768px) {
/* تعديل موضع مشغل الإذاعة في قسم Hero على الموبايل */
.radio-player {
    margin-top: 6rem; /* لدفعه للأسفل تحت شريط التنقل الثابت - تم زيادة القيمة هنا */
}
.hero-section {
padding: 60px 20px 20px;
}
}
.stations-content {
max-width: 1200px;
margin: 0 auto;
}
.stations-content h1 {
color: #004d40;
text-align: center;
font-size: 2.5rem;
margin-bottom: 1.5rem;
font-family: "Amiri", serif;
}
.stations-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
gap: 1.5rem;
padding: 0 1rem;
}
.station-card {
background: rgba(0, 77, 64, 0.1);
backdrop-filter: blur(5px);
padding: 1.5rem;
border-radius: 15px;
text-align: center;
transition: transform 0.3s ease;
border: 1px solid rgba(0, 77, 64, 0.1);
}
.station-card:hover {
transform: translateY(-5px);
}
.station-card h3 {
color: #004d40;
font-size: 1.4rem;
margin-bottom: 1rem;
font-family: "Amiri", serif;
}
.station-card .custom-audio-player {
margin-top: 0.5rem;
}
@media (max-width: 768px) {
.stations-content h1 {
font-size: 2rem;
}
.stations-grid {
grid-template-columns: 1fr;
}
}
</style>
</head>
<body>
<nav>
<div class="nav-container">
<a href="#" class="logo">
<span>وَذَكِّرْ فَإِنَّ الذِّكْرَى تَنْفَعُ الْمُؤْمِنِينَ</span>
</a>
<div class="nav-links">
</div>
<div class="menu-btn">
<i class="fas fa-bars"></i>
</div>
</div>
</nav>
<main class="hero-section" id="hero-section">
<div class="hero-content">
<div class="radio-player">
<div class="custom-audio-player" data-src="https://stream.radiojar.com/8s5u5tpdtwzuv">
<button class="play-pause-btn" id="mainPlayBtn">
<i class="fas fa-play"></i>
</button>
<div class="station-info">
<span class="station-name">إذاعة القرآن الكريم من القاهرة</span>
<span class="status" id="mainStatus">اضغط للتشغيل</span>
</div>
<button class="mute-btn">
<i class="fas fa-volume-up"></i>
</button>
</div>
<audio id="mainAudio" preload="none">
<source src="https://stream.radiojar.com/8s5u5tpdtwzuv" type="audio/mpeg">
متصفحك لا يدعم
مشغل الصوت
</audio>
</div>
</div>
</main>
<section class="all-stations-section" id="all-stations-section">
<div class="stations-content">
<h1>إذاعات مختارة</h1>
<div class="search-container">
<input type="text" id="searchInput" placeholder="ابحث عن الإذاعة...">
<i class="fas fa-search search-icon"></i>
</div>
<div class="stations-grid" id="allStationsGrid">
<p style="color: #004d40; text-align: center;">جاري تحميل
الإذاعات...</p>
</div>
</div>
<p class="copyright">
جميع الحقوق محفوظة &copy; <span id="year">2024</span> **أشرف بشير محمد**
</p>
</section>
<script>
const menuBtn = document.querySelector('.menu-btn');
const navLinks = document.querySelector('.nav-links');
menuBtn.addEventListener('click', () => {
navLinks.classList.toggle('active');
});
let currentlyPlaying = null;
let customPlayers = [];
// Custom Audio Player Class
class CustomAudioPlayer {
constructor(playerElement) {
this.playerElement = playerElement;
this.audio = null;
this.playBtn = playerElement.querySelector('.play-pause-btn');
this.muteBtn = playerElement.querySelector('.mute-btn');
this.statusElement = playerElement.querySelector('.status');
this.isPlaying = false;
this.isMuted = false;
this.volumeBeforeMute = 0.8;
this.init();
}
init() {
const audioSrc = this.playerElement.dataset.src;
this.audio = new Audio();
this.audio.src = audioSrc;
this.audio.preload = 'none';
this.audio.volume = 0.8;
this.playBtn.addEventListener('click', () => this.togglePlay());
if (this.muteBtn) {
this.muteBtn.addEventListener('click', () => this.toggleMute());
}
this.audio.addEventListener('loadstart', () => this.handleLoadStart());
this.audio.addEventListener('canplay', () => this.handleCanPlay());
this.audio.addEventListener('play', () => this.handlePlay());
this.audio.addEventListener('pause', () => this.handlePause());
this.audio.addEventListener('error', () => this.handleError());
this.audio.addEventListener('waiting', () => this.handleWaiting());
this.audio.addEventListener('playing', () => this.handlePlaying());
}
togglePlay() {
if (this.isPlaying) {
this.pause();
} else {
this.play();
}
}
play() {
customPlayers.forEach(player => {
if (player !== this && player.isPlaying) {
player.pause();
}
});
this.audio.play().catch((error) => {
console.error('Error playing audio:', error);
// Handle error UI if needed
});
}
pause() {
this.audio.pause();
}
toggleMute() {
if (this.isMuted) {
this.audio.volume = this.volumeBeforeMute;
this.isMuted = false;
this.muteBtn.classList.remove('muted');
this.muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
} else {
this.volumeBeforeMute = this.audio.volume;
this.audio.volume = 0;
this.isMuted = true;
this.muteBtn.classList.add('muted');
this.muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
}
}
handleLoadStart() {
this.updateStatus('جاري التحميل...');
}
handleCanPlay() {
// Not necessarily playing yet, but ready
if (!this.isPlaying) {
this.updateStatus('جاهز للتشغيل');
}
}
handlePlay() {
this.isPlaying = true;
this.playBtn.innerHTML = '<i class="fas fa-pause"></i>';
this.updateStatus('اضغط للتوقف');
currentlyPlaying = this.audio;
}
handlePause() {
this.isPlaying = false;
this.playBtn.innerHTML = '<i class="fas fa-play"></i>';
this.updateStatus('اضغط للتشغيل');
if (currentlyPlaying === this.audio) {
currentlyPlaying = null;
}
}
handleError() {
this.updateStatus('خطأ في البث');
this.playBtn.innerHTML = '<i class="fas fa-redo"></i>'; // Change icon to retry
if (currentlyPlaying === this.audio) {
currentlyPlaying = null;
}
}
handleWaiting() {
this.updateStatus('جاري الاتصال...');
}
handlePlaying() {
// Actual playing started
this.updateStatus('استماع مباشر');
}
updateStatus(text) {
if (this.statusElement) {
this.statusElement.textContent = text;
}
}
}
// الكلمات المفتاحية التي يجب أن تحتوي عليها الإذاعة لتظهر
const allowedKeywords = [
"فتاوى", "رقية", "عبد الباسط", "عبد الباسط عبد الصمد", "عبدالباسط", "عبد الصمد",
"المنشاوي", "الطبلاوي", "الحصري", "مصطفى اسماعيل", "آيات السكينة",
"السيرة النبوية", "حياة الصحابة", "تفسير", "أذكار الصباح", "أذكار المساء",
"محمود علي البنا", "الفتاوى العامة", "صور من حياة الصحابة", "فضل شهر رمضان",
"صحيح مسلم", "صحيح البخاري",
"قصص الانبياء", "قصص الأنبياء والرسل", "قصة", "الأنبياء", "الرسل",
"رياض الصالحين"
].map(k => k.toLowerCase().trim());
// الكلمات المفتاحية التي يجب ألا تحتوي عليها الإذاعة (للحذف)
const forbiddenKeywords = [
// لحذف اللغات الأجنبية والترجمات
"الأوردية", "الأردو", "Urdu", "ترجمة",
"English", "France", "French", "Türkçe", "Espanol", "German"
].map(k => k.toLowerCase().trim());
// دالة فحص ما إذا كانت الإذاعة مسموح بها
function isAllowed(stationName) {
const name = stationName.toLowerCase();
// 1. يجب أن تحتوي الإذاعة على إحدى الكلمات المسموح بها
const containsAllowed = allowedKeywords.some(keyword => name.includes(keyword));
// 2. يجب ألا تحتوي الإذاعة على أي من الكلمات المحظورة
const containsForbidden = forbiddenKeywords.some(keyword => name.includes(keyword));
// تظهر الإذاعة إذا كانت تحتوي على كلمة مسموح بها AND لا تحتوي على كلمة محظورة
return containsAllowed && !containsForbidden;
}
// دالة تحميل الإذاعات وتطبيق التصفية
async function loadAllStations() {
const stationsGrid = document.getElementById('allStationsGrid');
if (!stationsGrid) return;
stationsGrid.innerHTML = '<p style="color: #004d40; text-align: center;">جاري تحميل الإذاعات...</p>';
try {
const response = await fetch('https://mp3quran.net/api/v3/radios');
const data = await response.json();
stationsGrid.innerHTML = '';
let count = 0;

// تطبيق التصفية
data.radios.forEach(station => {
if (isAllowed(station.name)) {
const stationCard = document.createElement('div');
stationCard.className = 'station-card';
stationCard.innerHTML = `
<div class="station-content">
<h3>${station.name}</h3>
<div class="custom-audio-player" data-src="${station.url}">
<button class="play-pause-btn">
<i class="fas fa-play"></i>
</button>
<div class="station-info">
<span class="station-name">${station.name}</span>
<span class="status">اضغط للتشغيل</span>
</div>
<button class="mute-btn">
<i class="fas fa-volume-up"></i>
</button>
</div>
</div>
`;
stationsGrid.appendChild(stationCard);
count++;
// Initialize custom player for this station
const playerElement = stationCard.querySelector('.custom-audio-player');
const player = new CustomAudioPlayer(playerElement);
customPlayers.push(player);
}
});
if (count === 0) {
stationsGrid.innerHTML = '<p style="color: #004d40; text-align: center;">لم يتم العثور على إذاعات مطابقة للمعايير المحددة.</p>';
}
// Setup search functionality (Search will now only work on the filtered list)
const searchInput = document.getElementById('searchInput');
if (searchInput) {
searchInput.addEventListener('input', (e) => {
const searchTerm = e.target.value.toLowerCase();
const stations = stationsGrid.getElementsByClassName('station-card');
Array.from(stations).forEach(station => {
const stationName = station.querySelector('h3').textContent.toLowerCase();
station.style.display = stationName.includes(searchTerm) ? 'block' : 'none';
});
});
}
} catch (error) {
console.error('Error loading stations:', error);
stationsGrid.innerHTML = '<p class="error-message" style="color: #d32f2f; text-align: center;">عذراً، حدث خطأ في تحميل الإذاعات</p>';
}
}
// Initialize custom players and load stations when page loads
document.addEventListener('DOMContentLoaded', () => {
// تهيئة المشغل الموجود في قسم الـ Hero أولاً
const heroPlayerElement = document.querySelector('.hero-section .custom-audio-player');
if (heroPlayerElement) {
const heroPlayer = new CustomAudioPlayer(heroPlayerElement);
customPlayers.push(heroPlayer);
}
// تحميل الإذاعات المفلترة
loadAllStations();
// تحديث السنة في حقوق النشر
const yearSpan = document.getElementById('year');
if (yearSpan) {
yearSpan.textContent = new Date().getFullYear();
}
});
</script>
</body>
</html>
