<html lang="ar">
<head>

    <title>بستان الأعشاب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('herbal-garden.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            background-color: #f5e8de;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5em;
            margin: 0;
            flex-grow: 1;
            text-align: center;
            padding: 0 15px;
            color: #000;
            font-weight: bold;
        }

        .search-container {
            margin-right: 0;
            flex-grow: 0;
        }

        .search-container input {
            width: 90%;
            max-width: 300px;
            padding: 8px;
            border: none;
            border-radius: 20px;
            text-align: right;
        }

        nav {
            margin-top: 0;
            padding-right: 0;
        }

        .nav-links {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            color: #000;
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #4CAF50;
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 10;
            list-style: none;
            padding: 0;
            /* إضافة شريط التمرير */
            max-height: 300px; /* يمكنك تعديل القيمة حسب الحاجة */
            overflow-y: scroll; /* تم التغيير إلى scroll لضمان ظهوره دائمًا */
        }

        .dropdown-menu li a {
            color: #000;
            font-weight: normal;
            font-size: 1em;
            padding: 12px 16px;
            display: block;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        #herbs-menu li a:hover {
            background-color: #3e8e41;
            color: #fff;
        }

        #videos-menu li a:hover {
            background-color: #3e8e41;
            color: #fff;
        }

        #quran-menu li a:hover {
            background-color: #3e8e41;
            color: #fff;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 700px;
            border-radius: 10px;
            position: relative;
            text-align: center;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-header h2 {
            margin: 0;
            color: #4CAF50;
            font-size: 1.8em;
            flex-grow: 1;
            text-align: center;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-body {
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: scroll; /* تم التغيير إلى scroll لضمان ظهوره دائمًا */
            text-align: right;
        }

        .modal-body video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .modal-image {
            max-width: 80%;
            display: block;
            margin: 0 auto;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .modal-footer {
            display: flex;
            justify-content: space-around;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .modal-footer button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        .modal-footer button:hover {
            background-color: #3e8e41;
        }

            background-color: #f44336;
        }
        .modal-footer .secondary-button:hover {
            background-color: #da190b;
        }

            width: 90%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            resize: vertical;
        }

            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        #herb-details-page,

            display: none !important;
        }

        /* -------------------------------------- */

                align-items: center;
            }

                font-size: 1.2em;
                margin-bottom: 15px;
            }

                width: 100%;
                order: 1;
                margin-bottom: 10px;
            }

            .search-container input {
                width: 100%;
                max-width: none;
            }

            nav {
                width: 100%;
                order: 2;
            }

            .nav-links {
                display: flex;
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-links li {
                width: auto;
                text-align: center;
                margin: 0 5px;
            }

            .nav-links li a {
                padding: 8px 10px;
                font-size: 1em;
                white-space: nowrap;
            }

            .dropdown-menu {
                position: absolute;
                top: 100%;
                right: 0;
                width: 100%;
                box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            }
            
            .dropdown-menu li a {
                font-weight: normal;
            }
            
            .dropdown:hover .dropdown-menu {
                display: block;
            }

            .modal-content {
                width: 95%;
                max-width: none;
            }
        }
    </style>
</head>

            {

            },
            {
                type: "quran",
                name: "آيات تيسير الأمور",

                image: null
            },
             {
                type: "quran",
                name: "أذكار الصباح والمساء",
                text: "أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذا اليوم وخير ما بعده، وأعوذ بك من شر ما في هذا اليوم وشر ما بعده، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر. (ذِكْرُ الصَّبَاحِ). <br><br> أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذه الليلة وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة وشر ما بعدها، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر. (ذِكْرُ الْمَسَاءِ).",
                image: null
            }
        ];

        // تم إنشاء مصفوفة جديدة للفيديوهات بناءً على بيانات الأعشاب
        const videosData = herbs.filter(h => h.videoSrc !== null).map(h => ({
            type: "video",
            name: h.name,
            videoSrc: h.videoSrc,
            description: `فيديو توضيحي عن أهم فوائد ${h.name} وكيفية استخدامه.`
        }));

        const herbsMenu = document.getElementById('herbs-menu');
        const videosMenu = document.getElementById('videos-menu');
        const quranMenu = document.getElementById('quran-menu');
        const homeLink = document.getElementById('home-link');
        const contactLink = document.getElementById('contact-link');
        const searchInput = document.getElementById('searchInput');
        const contactForm = document.getElementById('contact-form');
        const messageArea = document.getElementById('message-area');

        const myModal = document.getElementById('myModal');
        const contactModal = document.getElementById('contactModal');
        const modalTitle = document.getElementById('modal-title');
        const modalBodyContent = document.getElementById('modal-body-content');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const footerButtons = myModal.querySelector('.modal-footer');

        let currentCategory = [];
        let currentIndex = 0;

        function showModal(category, index) {
            hideContactModal();
            currentCategory = category;
            currentIndex = index;
            renderModalContent();
            myModal.style.display = 'flex';
        }

        function hideModal() {
            myModal.style.display = 'none';
            const videoElement = modalBodyContent.querySelector('video');
            if (videoElement) {
                videoElement.pause();
                videoElement.src = '';
            }
        }
        
        function resetPage() {
            hideModal();
            hideContactModal();
        }
        
        function showContactModal() {
            hideModal();
            contactModal.style.display = 'flex';
        }
        
        function hideContactModal() {
            contactModal.style.display = 'none';
        }

        function showSearchResultsModal(herb) {
            modalTitle.textContent = herb.name;
            modalBodyContent.innerHTML = `
                <p>اختر ما تريد عرضه عن ${herb.name}:</p>
                <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
                    <button id="show-benefits-btn" style="background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">عرض الفوائد</button>
                    <button id="show-video-btn" style="background-color: #008CBA; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">مشاهدة الفيديو</button>
                </div>
            `;
            footerButtons.style.display = 'none';
            myModal.style.display = 'flex';
            
            document.getElementById('show-benefits-btn').addEventListener('click', () => {
                const index = herbs.findIndex(h => h.name === herb.name);
                showModal(herbs, index);
            });
            
            document.getElementById('show-video-btn').addEventListener('click', () => {
                const index = videosData.findIndex(v => v.name === herb.name);
                if (index !== -1) {
                    showModal(videosData, index);
                } else {
                    alert('لا يوجد فيديو لهذا الصنف حاليًا.');
                    hideModal();
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 1) {
                const foundHerb = herbs.find(h => h.name.includes(query));
                if (foundHerb) {
                    showSearchResultsModal(foundHerb);
                }
            } else {
                hideModal();
            }
        });

        homeLink.addEventListener('click', (e) => {
            e.preventDefault();
            resetPage();
        });

        contactLink.addEventListener('click', (e) => {
            e.preventDefault();
            showContactModal();
        });

        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userMessage = messageArea.value;
            if (userMessage.trim() !== '') {
                alert('شكراً لك! تم إرسال رسالتك بنجاح.');
                messageArea.value = '';
                hideContactModal();
            } else {
                alert('الرجاء كتابة رسالة قبل الإرسال.');
            }
        });

        function renderModalContent() {
            if (currentCategory.length === 0) return;

            const item = currentCategory[currentIndex];
            modalTitle.textContent = item.name;
            modalBodyContent.innerHTML = '';

            footerButtons.style.display = 'flex';

            if (item.type === "herb") {
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.name;
                img.classList.add('modal-image');
                modalBodyContent.appendChild(img);

                const benefitsTitle = document.createElement('p');
                benefitsTitle.innerHTML = '<strong>الفوائد:</strong>';
                modalBodyContent.appendChild(benefitsTitle);
                const benefitsList = document.createElement('ul');
                item.benefits.forEach(benefit => {
                    const li = document.createElement('li');
                    li.textContent = benefit;
                    benefitsList.appendChild(li);
                });
                modalBodyContent.appendChild(benefitsList);

                const howToUse = document.createElement('p');
                howToUse.innerHTML = `<strong>طريقة الاستخدام:</strong> ${item.howToUse}`;
                modalBodyContent.appendChild(howToUse);

                const cautions = document.createElement('p');
                cautions.innerHTML = `<strong>المحاذير:</strong> ${item.cautions}`;
                modalBodyContent.appendChild(cautions);

            } else if (item.type === "video") {
                const video = document.createElement('video');
                video.src = item.videoSrc;
                video.controls = true;
                video.autoplay = true;
                modalBodyContent.appendChild(video);

                const description = document.createElement('p');
                description.innerHTML = `<strong>الوصف:</strong> ${item.description}`;
                modalBodyContent.appendChild(description);

            } else if (item.type === "quran") {
                if (item.image) {
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.name;
                    img.classList.add('modal-image');
                    modalBodyContent.appendChild(img);
                }
                const quranText = document.createElement('p');
                quranText.innerHTML = `<strong>المحتوى:</strong> ${item.text}`;
                modalBodyContent.appendChild(quranText);
            }

            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === currentCategory.length - 1);
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderModalContent();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < currentCategory.length - 1) {
                currentIndex++;
                renderModalContent();
            }
        });

        function createHerbItemForModal(herb, index) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#';
            link.textContent = `فوائد ${herb.name}`;
            item.appendChild(link);
            link.addEventListener('click', (e) => {
                e.preventDefault();
                showModal(herbs, index);
            });
            return item;
        }

        function createVideoItemForModal(video, index) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#';
            link.textContent = `فيديو عن ${video.name}`;

            if (video.videoSrc === null) {
                link.style.color = '#ccc';
                link.style.cursor = 'default';
            }
            item.appendChild(link);
            link.addEventListener('click', (e) => {
                e.preventDefault();
                if (video.videoSrc !== null) {
                    showModal(videosData, index);
                }
            });
            return item;
        }

        function createQuranItemForModal(quran, index) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#';
            link.textContent = quran.name;
            item.appendChild(link);
            link.addEventListener('click', (e) => {
                e.preventDefault();
                showModal(quranData, index);
            });
            return item;
        }

        herbs.forEach((herb, index) => {
            herbsMenu.appendChild(createHerbItemForModal(herb, index));
        });

        videosData.forEach((video, index) => {
            videosMenu.appendChild(createVideoItemForModal(video, index));
        });

        quranData.forEach((quran, index) => {
            quranMenu.appendChild(createQuranItemForModal(quran, index));
        });
    </script>

</body>
</html>
